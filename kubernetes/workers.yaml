apiVersion: v1
kind: Namespace
metadata: { name: nebula }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: burst-workers, namespace: nebula }
spec:
  replicas: 2
  selector: { matchLabels: { app: burst-workers } }
  template:
    metadata: { labels: { app: burst-workers } }
    spec:
      serviceAccountName: burst-workers
      containers:
        - { name: worker, image: REPLACE_WITH_SIGNED_DIGEST, ports: [{ containerPort: 8080 }], securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }, resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: burst-workers, namespace: nebula }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: burst-workers }, minReplicas: 2, maxReplicas: 20, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: burst-workers, namespace: nebula }
spec: { minAvailable: 1, selector: { matchLabels: { app: burst-workers } } }
